<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hookline — phishing &amp; link checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f1f3f5;
    --paper-raised: #e7ebee;
    --ink: #1b2430;
    --ink-soft: #4b5563;
    --line: #d3d8de;
    --accent: #2d6e8e;
    --accent-soft: #dde9ee;
    --amber: #9c6a1f;
    --amber-soft: #f3e6d1;
    --critical: #a3403a;
    --critical-soft: #f3ddda;
    --good: #3f7a5c;
    --good-soft: #dcece3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12161c;
      --paper-raised: #1a2029;
      --ink: #e7eaee;
      --ink-soft: #a6adb8;
      --line: #2a323c;
      --accent: #7bbdd9;
      --accent-soft: #1e3742;
      --amber: #dba35c;
      --amber-soft: #3a2c17;
      --critical: #e0918b;
      --critical-soft: #3a2321;
      --good: #8fcaa9;
      --good-soft: #1e3327;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    line-height: 1.55;
  }
  main { max-width: 720px; margin: 0 auto; padding: 56px 24px 96px; }
  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-family: "Fjalla One", sans-serif;
    font-weight: 400;
    font-size: 44px;
    margin: 8px 0 6px;
  }
  .sub { color: var(--ink-soft); margin: 0 0 32px; max-width: 56ch; }

  .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .tab {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em;
    padding: 8px 14px; border: 1px solid var(--line); background: var(--paper-raised);
    color: var(--ink-soft); cursor: pointer; border-radius: 3px 3px 0 0;
  }
  .tab.active { background: var(--paper); color: var(--ink); border-bottom-color: var(--paper); font-weight: 600; }

  form {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 20px;
    background: var(--paper-raised);
  }
  textarea {
    width: 100%; min-height: 160px; resize: vertical;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13.5px;
    padding: 12px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--paper); color: var(--ink);
  }
  textarea:focus, button:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .hint { font-size: 12.5px; color: var(--ink-soft); }

  button {
    font-family: "Public Sans", sans-serif;
    font-weight: 600; font-size: 14.5px;
    background: var(--accent); color: var(--paper);
    border: none; border-radius: 3px; padding: 10px 18px; cursor: pointer;
  }
  button:hover { opacity: .92; }
  button:disabled { opacity: .5; cursor: default; }

  #result { margin-top: 28px; display: none; }

  .verdict-card {
    display: flex; align-items: center; gap: 16px;
    border: 1px solid var(--line); border-radius: 3px; padding: 18px 20px;
    margin-bottom: 18px;
  }
  .verdict-card.safe { background: var(--good-soft); border-color: var(--good); }
  .verdict-card.suspicious { background: var(--amber-soft); border-color: var(--amber); }
  .verdict-card.malicious { background: var(--critical-soft); border-color: var(--critical); }

  .score {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums;
    min-width: 64px;
  }
  .verdict-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
  }

  .mitre-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 18px; }
  .mitre-pill {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; padding: 2px 8px; border-radius: 2px;
    background: var(--accent-soft); color: var(--accent);
  }

  .evidence-item {
    padding: 12px 0; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 16px;
  }
  .evidence-item:first-child { border-top: none; }
  .evidence-detail { font-size: 14px; }
  .evidence-signal {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; color: var(--ink-soft); display: block; margin-top: 3px;
  }
  .evidence-points {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px; white-space: nowrap; color: var(--ink-soft);
  }

  .notes { margin-top: 16px; font-size: 13px; color: var(--ink-soft); }
  .error { margin-top: 20px; color: var(--critical); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Week 1 spike · rules only</div>
  <h1>Hookline</h1>
  <p class="sub">Paste a link, or a raw email (headers + body), to get a scored verdict with the evidence behind it.</p>

  <div class="tabs">
    <div class="tab active" data-type="url">Link</div>
    <div class="tab" data-type="email">Email</div>
  </div>

  <form id="check-form">
    <textarea id="content" placeholder="https://paypa1-secure-login.top/verify"></textarea>
    <div class="row">
      <span class="hint" id="hint">Paste a single URL.</span>
      <button type="submit" id="submit-btn">Check</button>
    </div>
  </form>

  <div id="result">
    <div class="verdict-card" id="verdict-card">
      <div class="score" id="score">—</div>
      <div>
        <div class="verdict-label" id="verdict-label">—</div>
        <div id="notes" class="notes" style="margin-top:2px;"></div>
      </div>
    </div>
    <div class="mitre-row" id="mitre-row"></div>
    <div id="evidence-list"></div>
  </div>

  <div class="error" id="error" style="display:none;"></div>
</main>

<script>
  const tabs = document.querySelectorAll(".tab");
  const contentEl = document.getElementById("content");
  const hintEl = document.getElementById("hint");
  const form = document.getElementById("check-form");
  const submitBtn = document.getElementById("submit-btn");
  const resultEl = document.getElementById("result");
  const errorEl = document.getElementById("error");

  let currentType = "url";
  const placeholders = {
    url: "https://paypa1-secure-login.top/verify",
    email: "From: \"PayPal Support\" <security@paypa1-alerts.top>\nReply-To: recovery@paypa1-alerts.top\nSubject: Unusual activity on your account\n\nWe noticed unusual activity. Verify your account immediately: https://paypa1-secure-login.top/verify",
  };
  const hints = {
    url: "Paste a single URL.",
    email: "Paste raw email source (headers + body) — most webmail has a \"show original\" option.",
  };

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentType = tab.dataset.type;
      contentEl.placeholder = placeholders[currentType];
      hintEl.textContent = hints[currentType];
    });
  });

  function verdictWord(v) {
    return { safe: "Safe", suspicious: "Suspicious", malicious: "Malicious" }[v] || v;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const content = contentEl.value.trim();
    if (!content) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Checking…";
    errorEl.style.display = "none";
    resultEl.style.display = "none";

    try {
      const res = await fetch("/check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: currentType, content }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail ? JSON.stringify(body.detail) : `Request failed (${res.status})`);
      }
      const data = await res.json();

      const card = document.getElementById("verdict-card");
      card.className = "verdict-card " + data.verdict;
      document.getElementById("score").textContent = data.score;
      document.getElementById("verdict-label").textContent = verdictWord(data.verdict);
      document.getElementById("notes").textContent = data.notes || "";

      const mitreRow = document.getElementById("mitre-row");
      mitreRow.innerHTML = "";
      data.mitre_techniques.forEach(t => {
        const pill = document.createElement("span");
        pill.className = "mitre-pill";
        pill.textContent = t;
        mitreRow.appendChild(pill);
      });

      const list = document.getElementById("evidence-list");
      list.innerHTML = "";
      if (data.evidence.length === 0) {
        const div = document.createElement("div");
        div.className = "evidence-item";
        div.innerHTML = "<span class='evidence-detail'>No signals triggered.</span>";
        list.appendChild(div);
      } else {
        data.evidence.forEach(ev => {
          const div = document.createElement("div");
          div.className = "evidence-item";
          div.innerHTML = `
            <span class="evidence-detail">${ev.detail}<span class="evidence-signal">${ev.signal}</span></span>
            <span class="evidence-points">${ev.points > 0 ? "+" + ev.points : ev.points}</span>
          `;
          list.appendChild(div);
        });
      }

      resultEl.style.display = "block";
    } catch (err) {
      errorEl.textContent = err.message || "Something went wrong.";
      errorEl.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Check";
    }
  });
</script>
</body>
</html>
